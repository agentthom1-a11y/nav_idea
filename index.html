<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      // Defensive trap: prevent "Cannot set property fetch of #<Window> which has only a getter"
      // This catches any overzealous polyfills or browser extensions attempting to overwrite window.fetch
      const originalFetch = window.fetch;
      try {
        Object.defineProperty(window, 'fetch', {
          get: () => originalFetch,
          set: (val) => { console.warn("Intercepted attempt to overwrite window.fetch"); },
          configurable: true
        });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx?v=12"></script>
  </body>
</html>
